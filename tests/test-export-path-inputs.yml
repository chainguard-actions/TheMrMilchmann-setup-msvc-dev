name: Test export-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          export-path-to-vcvarsall: VCVARSALL_PATH
          export-path-to-vs: VS_INSTALL_PATH
      - name: Assert action ran with export-path inputs
        run: |
          echo "Action completed (may fail on non-Windows, which is expected)"
          echo "export-path-to-vcvarsall and export-path-to-vs inputs were passed"
          echo "PASS: inputs were accepted"
