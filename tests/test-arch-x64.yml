name: Test arch x64
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          arch: x64
          export-path-to-vcvarsall: VCVARSALL_PATH
      - name: Assert MSVC x64 environment is set up
        shell: cmd
        run: |
          where cl.exe
          if %ERRORLEVEL% neq 0 (
            echo FAIL: cl.exe not found in PATH
            exit /b 1
          )
          echo PASS: cl.exe found in PATH for x64
      - name: Assert VCVARSALL_PATH is set
        shell: cmd
        run: |
          echo VCVARSALL_PATH=%VCVARSALL_PATH%
          if "%VCVARSALL_PATH%"=="" (
            echo FAIL: VCVARSALL_PATH environment variable is not set
            exit /b 1
          )
          echo PASS: VCVARSALL_PATH is set to %VCVARSALL_PATH%
