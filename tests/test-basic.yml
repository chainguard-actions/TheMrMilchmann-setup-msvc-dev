name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert MSVC tools are available
        shell: cmd
        run: |
          cl.exe 2>&1 | findstr /i "Microsoft" >nul
          if errorlevel 1 (
            echo FAIL: cl.exe not found or not from Microsoft
            exit /b 1
          )
          echo PASS: cl.exe is available
      - name: Assert link.exe is available
        shell: cmd
        run: |
          link.exe 2>&1 | findstr /i "Microsoft" >nul
          if errorlevel 1 (
            echo FAIL: link.exe not found or not from Microsoft
            exit /b 1
          )
          echo PASS: link.exe is available
