name: Test basic MSVC setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert MSVC environment is set up
        shell: cmd
        run: |
          where cl.exe
          if %ERRORLEVEL% neq 0 (
            echo FAIL: cl.exe not found in PATH
            exit /b 1
          )
          echo PASS: cl.exe found in PATH
