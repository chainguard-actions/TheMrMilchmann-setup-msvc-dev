name: Test toolset input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          toolset: "14.0"
      - name: Assert cl.exe is available
        shell: cmd
        run: |
          where cl.exe
          if %ERRORLEVEL% NEQ 0 (
            echo FAIL: cl.exe not found on PATH
            exit /b 1
          )
          echo PASS
