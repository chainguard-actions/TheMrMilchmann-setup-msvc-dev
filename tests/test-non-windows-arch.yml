name: Test arch input on non-Windows runner fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: x64
      - name: Assert action failed due to unsupported platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "platform: $(uname -s)"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-Windows platform, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert no MSVC environment was exported
        run: |
          echo "VSCMD_ARG_TGT_ARCH='${VSCMD_ARG_TGT_ARCH:-}' VCINSTALLDIR='${VCINSTALLDIR:-}'"
          if [ -n "${VSCMD_ARG_TGT_ARCH:-}" ] || [ -n "${VCINSTALLDIR:-}" ]; then
            echo "FAIL: MSVC environment variables should not be set"
            exit 1
          fi
          echo "PASS"
