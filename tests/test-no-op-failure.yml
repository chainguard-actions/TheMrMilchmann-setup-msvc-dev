name: Test no-op failure when no inputs provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no inputs are provided (no arch, no export-path-to-vcvarsall,
      # no export-path-to-vs), the action should fail.
      # On Linux, the platform check fires first and fails with
      # "only supported on Windows". Either way, the action must fail.
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed with no inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no inputs are provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no inputs provided"
