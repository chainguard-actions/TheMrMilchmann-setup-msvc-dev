name: Test export-path-to-vcvarsall input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # On Linux the action fails with a platform error before exporting anything.
      # We verify the action fails gracefully (not a crash/exception).
      - id: action
        uses: .
        with:
          export-path-to-vcvarsall: VCVARSALL_PATH
        continue-on-error: true

      - name: Assert action failed gracefully on non-Windows platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on non-Windows platform, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on non-Windows platform"
