name: Test spectre toolset uwp inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          spectre: true
          toolset: "14.3"
          uwp: false
      - name: Assert action ran with spectre toolset uwp inputs
        run: |
          echo "Action completed (may fail on non-Windows, which is expected)"
          echo "spectre, toolset, and uwp inputs were passed"
          echo "PASS: inputs were accepted"
