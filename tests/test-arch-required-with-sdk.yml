name: Test arch required when sdk specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When sdk is specified without arch, the action should fail with
      # "Please specify the architecture". On Linux, the platform check fires
      # first and fails with "only supported on Windows". Either way, the
      # action must fail — we verify the failure outcome.
      - id: action
        uses: .
        with:
          sdk: "10.0.19041.0"
        continue-on-error: true

      - name: Assert action failed when sdk given without arch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when sdk is given without arch, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when sdk specified without arch"
