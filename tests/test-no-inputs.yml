name: Test no inputs provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no inputs are provided, the action should fail because it "did
      # nothing" (no arch, no export-path-to-vcvarsall, no export-path-to-vs).
      # On Linux (act), the platform check fires first, so the action fails
      # regardless. We verify the action correctly reports failure.
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed (no inputs or non-Windows platform)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no inputs are provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with no inputs"
