name: Test export inputs on non-Windows runner do not export variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          vs-path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          export-path-to-vcvarsall: TEST_VCVARSALL_PATH
          export-path-to-vs: TEST_VS_PATH
      - name: Assert action failed due to unsupported platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-Windows platform, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert requested variables were not exported
        run: |
          echo "TEST_VCVARSALL_PATH='${TEST_VCVARSALL_PATH:-}' TEST_VS_PATH='${TEST_VS_PATH:-}'"
          if [ -n "${TEST_VCVARSALL_PATH:-}" ] || [ -n "${TEST_VS_PATH:-}" ]; then
            echo "FAIL: variables should not be exported when the platform check fails"
            exit 1
          fi
          echo "PASS"
